name: Verify R4B

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - v1.0-alpha-1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean verify
